<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Панель VK-бота</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--text:#e8eaf0;--muted:#8b92a5;--ok:#2ecc71;--bad:#e74c3c;--acc:#4c8dff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:24px}
  .card{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:440px}
  h1{margin:0 0 16px;font-size:22px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  input{width:100%;padding:10px;border-radius:8px;border:1px solid #2b3040;background:#0f1115;color:var(--text)}
  .row{display:flex;gap:10px;margin-top:16px}
  button{flex:1;padding:12px;border:0;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;color:#fff}
  #start{background:var(--ok)} #stop{background:var(--bad)} #save{background:var(--acc)}
  button:disabled{opacity:.5}
  .status{margin-top:20px;padding:12px;border-radius:10px;background:#0f1115;font-size:14px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--muted)}
  .on .dot{background:var(--ok)} .off .dot{background:var(--bad)}
  small{color:var(--muted);display:block;margin-top:12px;line-height:1.4}
</style>
</head>
<body>
<div class="card">
  <h1>🤖 VK-бот</h1>

  <label>Репозиторий (владелец/название)</label>
  <input id="repo" placeholder="username/vk-bot-site">
  <label>GitHub токен (fine-grained, Actions: Read and write)</label>
  <input id="token" type="password" placeholder="github_pat_...">
  <div class="row"><button id="save">Сохранить</button></div>

  <div class="row">
    <button id="start">▶ Запустить</button>
    <button id="stop">⏹ Остановить</button>
  </div>

  <div id="status" class="status off"><span class="dot"></span><span id="stext">Статус неизвестен</span></div>
  <small>Токен и репозиторий хранятся только в вашем браузере (localStorage).</small>
</div>

<script>
const $ = id => document.getElementById(id);
const WF = "bot.yml";
$("repo").value = localStorage.getItem("repo") || "";
$("token").value = localStorage.getItem("token") || "";

$("save").onclick = () => {
  localStorage.setItem("repo", $("repo").value.trim());
  localStorage.setItem("token", $("token").value.trim());
  refresh();
};

async function api(path, method = "GET", body) {
  const repo = localStorage.getItem("repo"), token = localStorage.getItem("token");
  if (!repo || !token) throw new Error("Укажите репозиторий и токен");
  const r = await fetch(`https://api.github.com/repos/${repo}${path}`, {
    method,
    headers: {
      "Authorization": `Bearer ${token}`,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) throw new Error(`GitHub ${r.status}: ${(await r.text()).slice(0,150)}`);
  return r.status === 204 || r.status === 202 ? null : r.json();
}

async function activeRuns() {
  const out = [];
  for (const s of ["in_progress", "queued"]) {
    const d = await api(`/actions/workflows/${WF}/runs?status=${s}&per_page=20`);
    out.push(...d.workflow_runs);
  }
  return out;
}

function setStatus(on, text) {
  $("status").className = "status " + (on ? "on" : "off");
  $("stext").textContent = text;
}

async function refresh() {
  try {
    const runs = await activeRuns();
    runs.length ? setStatus(true, "Бот работает") : setStatus(false, "Бот остановлен");
  } catch (e) { setStatus(false, e.message); }
}

$("start").onclick = async () => {
  try {
    if ((await activeRuns()).length) return setStatus(true, "Бот уже работает");
    await api(`/actions/workflows/${WF}/dispatches`, "POST", { ref: "main" });
    setStatus(true, "Запускаю… (подождите ~30 сек)");
    setTimeout(refresh, 15000);
  } catch (e) { setStatus(false, e.message); }
};

$("stop").onclick = async () => {
  try {
    const runs = await activeRuns();
    for (const r of runs) await api(`/actions/runs/${r.id}/cancel`, "POST");
    setStatus(false, "Останавливаю…");
    setTimeout(refresh, 5000);
  } catch (e) { setStatus(false, e.message); }
};

refresh();
setInterval(refresh, 20000);
</script>
</body>
</html>
